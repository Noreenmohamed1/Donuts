<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Circles - Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="cart-section">

    <h2>YOUR SHOPPING CART</h2>
    <p class="cart-desc">Your favorite treats are waiting for you!</p>

    <div class="cart-container">

        <div class="cart-items" id="cart-items">
            <p class="empty-cart">Your cart is empty! 🍩</p>
        </div>

        <div class="cart-summary">

            <h3>Order Summary</h3>

            <div class="summary-row">
                <span>Total Items:</span>
                <span id="total-items">0</span>
            </div>

            <div class="summary-row">
                <span>Total Price:</span>
                <span id="total-price">$0.00</span>
            </div>

            <button class="checkout-btn">Proceed to Checkout</button>

            <a href="index.html" class="continue-shopping">
                Continue Shopping
            </a>

        </div>

    </div>

    
    <!-- Wishlist Section -->

<div class="wishlist-section" id="wishlist-section">

    <h2>YOUR FAVORITES ♡</h2>
    <p>Your favorite treats!</p>

    <div class="wishlist-container" id="wishlist-container">
    </div>

</div>


</section>

<script src="js/script.js"></script>
</body>
</html>
